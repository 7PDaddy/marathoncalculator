<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pace Widget - Marathon &amp; More Calculator</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --paper:#F4F5F1; --ink:#121A22; --muted:#5C6672; --line:#E2E5DD;
    --blue:#2447C7; --blue-deep:#16307F; --tape:#FFD23F;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:transparent; color:var(--ink);
    font-family:-apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size:15px;
  }
  .card{
    background:#fff; border:1.5px solid var(--ink); border-radius:12px;
    padding:14px 14px 10px; max-width:340px; margin:0 auto;
    border-bottom:4px solid var(--tape);
  }
  .head{font-weight:800; font-size:15px; letter-spacing:.4px; text-transform:uppercase; margin-bottom:10px}
  .head span{color:var(--blue)}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px}
  .chip{
    font-weight:700; font-size:13px; padding:6px 11px; border-radius:999px;
    border:1.5px solid var(--line); background:#fff; cursor:pointer; color:var(--ink);
  }
  .chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:#fff}
  label{display:block; font-size:11.5px; font-weight:700; color:var(--muted); margin-bottom:3px; text-transform:uppercase; letter-spacing:.4px}
  input{
    width:100%; padding:9px 11px; font-size:17px; border:1.5px solid var(--line);
    border-radius:8px; font-variant-numeric:tabular-nums; color:var(--ink);
  }
  input:focus{outline:3px solid var(--tape); border-color:var(--ink)}
  .out{
    display:flex; gap:8px; margin-top:10px;
  }
  .out div{
    flex:1; background:var(--paper); border-radius:8px; padding:8px 10px; text-align:center;
  }
  .out .l{font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px}
  .out .v{font-weight:800; font-size:19px; font-variant-numeric:tabular-nums}
  .cta{
    display:block; text-align:center; margin-top:10px; padding:9px;
    background:var(--blue); color:#fff; text-decoration:none; font-weight:700;
    font-size:14px; border-radius:8px;
  }
  .cta:hover{background:var(--blue-deep)}
  .credit{
    text-align:center; font-size:11px; color:var(--muted); margin-top:8px;
  }
  .credit a{color:var(--blue); font-weight:600; text-decoration:none}
</style>
</head>
<body>
  <div class="card">
    <div class="head">Race Pace <span>Quick Check</span></div>
    <div class="chips" id="chips" role="group" aria-label="Distance">
      <button class="chip" data-d="marathon" aria-pressed="true">Marathon</button>
      <button class="chip" data-d="half">Half</button>
      <button class="chip" data-d="10k">10K</button>
      <button class="chip" data-d="5k">5K</button>
    </div>
    <label for="t">Goal time (h:mm:ss or mm:ss)</label>
    <input id="t" inputmode="numeric" value="4:00:00" autocomplete="off">
    <div class="out">
      <div><div class="l">Per mile</div><div class="v" id="pmi">9:09</div></div>
      <div><div class="l">Per km</div><div class="v" id="pkm">5:41</div></div>
    </div>
    <a class="cta" id="cta" href="https://marathoncalculator.com/" target="_blank" rel="noopener">Build the full race plan &rarr;</a>
    <div class="credit">Free widget by <a href="https://marathoncalculator.com/" target="_blank" rel="noopener">MarathonCalculator.com</a></div>
  </div>
<script>
(function(){
  "use strict";
  var KM = { marathon:42.195, half:21.0975, "10k":10, "5k":5 };
  var MI = 1.609344;
  var dist = "marathon";
  var t = document.getElementById("t");

  function parseTime(str){
    str = String(str||"").trim();
    if (!/^\d{1,3}(:\d{1,2}){0,2}$/.test(str)) return null;
    var p = str.split(":").map(Number);
    if (p.length === 3) return p[0]*3600 + p[1]*60 + p[2];
    if (p.length === 2) return p[0]*60 + p[1];
    return p[0]*60;
  }
  function pad(n){ return (n<10?"0":"")+n; }
  function fmtPace(s){
    if (!isFinite(s) || s<=0) return "-";
    var r = Math.round(s);
    return Math.floor(r/60) + ":" + pad(r%60);
  }
  function fmtTime(sec){
    sec = Math.round(sec);
    var h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
    return h>0 ? h+":"+pad(m)+":"+pad(s) : m+":"+pad(s);
  }
  function calc(){
    var sec = parseTime(t.value);
    t.style.borderColor = sec===null ? "#B4231F" : "";
    if (sec===null) return;
    var km = KM[dist];
    document.getElementById("pmi").textContent = fmtPace(sec/(km/MI));
    document.getElementById("pkm").textContent = fmtPace(sec/km);
    var key = dist==="10k" ? "10k" : dist==="5k" ? "5k" : dist;
    document.getElementById("cta").href =
      "https://marathoncalculator.com/?d=" + key + "&u=mi&mode=even&t=" + fmtTime(sec);
  }
  document.querySelectorAll("#chips .chip").forEach(function(c){
    c.addEventListener("click", function(){
      dist = c.dataset.d;
      document.querySelectorAll("#chips .chip").forEach(function(x){
        x.setAttribute("aria-pressed", x===c ? "true" : "false");
      });
      calc();
    });
  });
  t.addEventListener("input", calc);
  calc();
})();
</script>
</body>
</html>
